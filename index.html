<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Pixel Name Fix Spacing</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            /* Nền trong suốt để khớp với mọi màu nền của Notion */
            background-color: transparent; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 220px; /* Nới rộng khung nền ra một chút để chứa đủ dấu */
            margin: 0;
            text-align: center;
            overflow: hidden;
            font-family: 'VT323', monospace;
        }
        
        .wrapper {
            animation: float 4s ease-in-out infinite; 
            padding: 20px;
        }

        .title {
            font-size: 32px; 
            color: #888888; /* Màu xám trung tính, đẹp trên cả nền tối/sáng */
            
            /* TĂNG KHOẢNG CÁCH DƯỚI ĐỂ TRÁNH ĐỤNG DẤU MŨ CỦA TÊN */
            margin-bottom: 15px; 
            letter-spacing: 2px;
        }

        .name {
            font-size: 80px; 
            color: #ea580c; /* Cam đậm */
            text-shadow: none; 
            
            /* TĂNG CHIỀU CAO DÒNG ĐỂ DẤU MŨ CÓ CHỖ THỞ */
            line-height: 1.3; 
        }

        .cursor {
            animation: blink 1s step-end infinite;
            color: #ea580c; 
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="title">TRANG GIỚI THIỆU</div>
        <div class="name">NGUYỄN CÔNG ĐẠI<span class="cursor">_</span></div>
    </div>
</body>
</html>
