<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Pixel Name Fix Overlap</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: transparent; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 250px; /* Tăng chiều cao khung nền để chứa khoảng trống */
            margin: 0;
            text-align: center;
            overflow: hidden;
            font-family: 'VT323', monospace;
        }
        
        .wrapper {
            animation: float 4s ease-in-out infinite; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px; /* KHE HỞ CỨNG: Ép 2 dòng cách nhau 30px, bạn có thể tăng lên 40px hoặc 50px nếu muốn xa hơn nữa */
        }

        .title {
            font-size: 32px; 
            color: #888888; 
            margin: 0; /* Xóa các viền lề rườm rà cũ */
            letter-spacing: 2px;
        }

        .name {
            font-size: 80px; 
            color: #ea580c; 
            margin: 0;
            line-height: 1; /* Thu gọn hộp chữ lại sát nét chữ nhất */
        }

        .cursor {
            animation: blink 1s step-end infinite;
            color: #ea580c; 
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="title">TRANG GIỚI THIỆU</div>
        <div class="name">NGUYỄN CÔNG ĐẠI<span class="cursor">_</span></div>
    </div>
</body>
</html>
