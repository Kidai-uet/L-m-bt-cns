<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Pixel Name Light Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff; /* NỀN TRẮNG hoàn toàn theo yêu cầu */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 160px; 
            margin: 0;
            text-align: center;
            overflow: hidden;
            font-family: 'VT323', monospace;
        }
        
        .wrapper {
            animation: float 4s ease-in-out infinite; 
            padding: 10px;
        }

        .title {
            font-size: 32px; /* Làm chữ TRANG GIỚI THIỆU to lên */
            color: #6b7280; /* Màu xám đậm để thanh lịch và dễ nhìn trên nền trắng */
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .name {
            font-size: 80px; /* Làm chữ NGUYỄN CÔNG ĐẠI to hẳn lên */
            color: #ea580c; /* Màu cam đậm, sắc nét và nổi bật trên nền trắng */
            text-shadow: none; /* XÓA HOÀN TOÀN BÓNG PHÍA DƯỚI */
            line-height: 1.1;
        }

        .cursor {
            animation: blink 1s step-end infinite;
            color: #ea580c; 
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="title">TRANG GIỚI THIỆU</div>
        <div class="title">""</div>
        <div class="name">NGUYỄN CÔNG ĐẠI<span class="cursor">_</span></div>
    </div>
</body>
</html>
