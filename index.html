<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Pixel Name Embed</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            /* Nền trong suốt để hòa vào màu trắng của Notion hiện tại */
            background-color: transparent; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 150px; 
            margin: 0;
            text-align: center;
            overflow: hidden;
            font-family: 'VT323', monospace; /* Gọi font Pixel tiếng Việt */
        }
        
        .wrapper {
            animation: float 4s ease-in-out infinite; 
            padding: 20px;
        }

        .title {
            font-size: 26px; /* Chữ to vừa phải */
            color: #6b7280; /* Xám thanh lịch cho nền sáng */
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .name {
            font-size: 64px; /* Tên cực to và rõ ràng */
            color: #ea580c; /* Màu cam đậm sắc nét */
            /* Bóng đổ màu cam nhạt thay vì màu đen để chữ không bị bẩn */
            text-shadow: 3px 3px 0px #fed7aa; 
            line-height: 1.1;
        }

        .cursor {
            animation: blink 1s step-end infinite;
            color: #ea580c; 
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="title">TRANG GIỚI THIỆU</div>
        <div class="name">NGUYỄN CÔNG ĐẠI<span class="cursor">_</span></div>
    </div>
</body>
</html>
